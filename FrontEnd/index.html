<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Sorting - Selection Sort</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="selection-sort-container">
        <h2>Trực quan hóa: Selection Sort</h2>
        
        <!-- Khu vực điều khiển -->
        <div class="control-panel">
            <button id="btn-generate">Tạo mảng ngẫu nhiên</button>
            <button id="btn-selection-sort">Chạy Selection Sort</button>
        </div>

        <!-- Khu vực vẽ các cột (bars) để hiển thị mảng -->
        <div id="array-container" class="array-container"></div>
    </div>

    <!-- Liên kết file JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
