<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Sorting</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-title">
            <h2>Visual Sorting</h2>
        </div>
        <div class="header-stats">
            <div class="stat">CMP <strong>0</strong></div>
            <div class="stat">SWP <strong>0</strong></div>
            <div class="stat">ACC <strong>0</strong></div>
        </div>
    </header>

    <!-- Khung hiển thị cột -->
    <main class="visualization-board">
        <div id="board" class="board"></div>
    </main>

    <!-- Bảng điều khiển phía dưới -->
    <section class="control-panel">
        <!-- Cột trái: Chọn thuật toán (Có hiệu ứng trượt) -->
        <div class="panel-box left-panel">
            <div class="algo-slider-container">
                <div class="algo-slider-track" id="algo-track">
                    <div class="algo-grid" id="page-0"></div>
                    <div class="algo-grid" id="page-1"></div>
                </div>
            </div>
        </div>

        <!-- Cột phải: Các nút bấm và thanh trượt -->
        <div class="panel-box right-panel">
            <div class="controls-top">
                <div class="buttons">
                    <button class="btn-start" id="btn-start">Start</button>
                    <button class="btn-action" id="btn-step">Step</button>
                    <button class="btn-action" id="btn-shuffle">Shuffle</button>
                </div>
            </div>
            <div class="sliders">
                <div class="slider-group">
                    <div class="slider-header">
                        <label>Array size</label>
                        <span id="size-value">75 bars</span>
                    </div>
                    <input type="range" id="size-slider" min="10" max="200" value="75">
                </div>
                <div class="slider-group">
                    <div class="slider-header">
                        <label>Delay</label>
                        <span id="delay-value">16 ms</span>
                    </div>
                    <input type="range" id="delay-slider" min="1" max="100" value="16">
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>nho hieu dep trai </p>
    </footer>

    <script src="js/visualizer.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
