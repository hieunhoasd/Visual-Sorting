<!DOCTYPE html>
<html lang = "vi">
<head>
    <meta charset = "UTF-8">
    <title> Sorting Visualizer</title>
    <link rel = "stylesheet" href = "css/style.css">
    <link rel = "stylesheet" href = "css/animations.css">
</head>

<body>
    <header>
        <h1>Sorting Visualizer</h1>
    </header>

    <section id = "control-panel">
        <label>
            Thuật toán:
            <select id = "algorithm-select">
                <option value = "bubble_sort">Bubble Sort</option>
                <option value = "selection_sort">Selection Sort</option>
                <option value = "insertion_sort">Insertion Sort</option>
                <option value = "merge_sort">Merge Sort</option>
                <option value = "quick_sort">Quick Sort</option>
                <option value = "heap_sort">Heap Sort</option>
                <option value = "radix_lsd_sort">Radix LSD Sort</option>
                <option value = "radix_msd_sort">Radix MSD Sort</option>
                <option value = "shell_sort">Shell Sort</option>
                <option value = "bitonic_sort">Bitonic Sort</option>
            </select>
        </label>

        <label>
            Số phần tử: <span id = "size-value">20</span>
            <input type = "range" id = "size-slider" min = "5" max ="80" value ="20">
        </label>

        <label>
            Tốc độ: <span id = "speed-value">300</span>ms
            <input type = "range" id = "speed-slider" min = "20" max = "1000" value = "300">

        </label>

        <button id = "generate-btn">Tạo mảng mới</button>
        <button id = "start-btn">Bắt đầu</button>
        <button id ="reset-btn">Reset</button>
    </section>

    <section id ="visualization-board">
        <div id = "bars-container"></div>
    </section>

    <section id = "legend">
        <span class = "legend-item"><span class="box default"></span>Bình thường</span>
        <span class = "legend-item"><span class="box compare"></span>Đang so sánh</span>
        <span class = "legend-item"><span class="box swap"></span>Đang hoán đổi</span>
        <span class = "legend-item"><span class="box sorted"></span>Đã xong</span>
    </section>

    <script src="js/api.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/animator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
